<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cardio — Reading Materials</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
  :root {
    --bg: #0a0e14;
    --bg-2: #10151d;
    --bg-3: #171d28;
    --card: #121821;
    --card-hover: #1a2130;
    --border: #1f2836;
    --border-2: #2b3648;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-faint: #5a6472;
    --accent: #00c853;
    --accent-2: #00bfa5;
    --blue: #4d9fff;
    --radius: 16px;
    --shadow: 0 4px 20px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    overscroll-behavior-y: none;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; font-size: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }

  #app { min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 24px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px 10px;
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(180deg, var(--bg) 75%, transparent);
    backdrop-filter: blur(10px);
  }
  .logo-wrap { display: flex; align-items: center; gap: 11px; }
  .logo-badge {
    width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 800; font-size: 14px; color: #fff;
    box-shadow: 0 4px 14px rgba(0,200,83,0.35);
  }
  .logo-text { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; }
  .logo-sub { font-size: 11px; color: var(--text-dim); font-weight: 500; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--bg-3); border: 1px solid var(--border-2);
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700; color: var(--text-dim);
  }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--bg-3); border: 1px solid var(--border);
    display: grid; place-items: center; flex-shrink: 0;
    transition: all 0.2s;
    text-decoration: none; color: inherit;
  }
  .icon-btn:hover { background: var(--card-hover); border-color: var(--border-2); }
  .icon-btn:active { transform: scale(0.95); }

  .crumbs {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 18px 14px;
    font-size: 12px; font-weight: 600;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .crumb { color: var(--text-dim); padding: 2px 0; }
  .crumb.link { cursor: pointer; transition: color 0.15s; }
  .crumb.link:hover { color: var(--accent); }
  .crumb.current { color: var(--text); font-weight: 700; }
  .crumb-sep { opacity: 0.35; }

  .search-wrap {
    margin: 4px 18px 16px;
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 15px;
    transition: border-color 0.2s;
  }
  .search-wrap:focus-within { border-color: var(--accent); }
  .search-wrap svg { flex-shrink: 0; opacity: 0.55; }
  .search-wrap input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 14px;
  }
  .search-wrap input::placeholder { color: var(--text-faint); }

  .section-title {
    font-size: 11px; font-weight: 800; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 1.2px;
    padding: 0 18px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-title .count {
    background: var(--bg-3); color: var(--text-dim);
    padding: 3px 9px; border-radius: 999px;
    font-size: 10px; font-weight: 700;
  }

  .list { padding: 0 18px; display: flex; flex-direction: column; gap: 12px; }

  .course-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: left;
    width: 100%;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .course-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--course-color, var(--accent));
    opacity: 0;
    transition: opacity 0.2s;
  }
  .course-card:hover::before { opacity: 1; }
  .course-card:hover { background: var(--card-hover); border-color: var(--border-2); }
  .course-card:active { transform: scale(0.985); }

  .course-thumb {
    width: 52px; height: 52px; border-radius: 14px;
    display: grid; place-items: center; flex-shrink: 0;
    font-size: 24px;
    background: var(--course-bg, rgba(0,200,83,0.12));
    border: 1px solid var(--course-border, rgba(0,200,83,0.3));
  }
  .course-body { flex: 1; min-width: 0; }
  .course-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.2px; }
  .course-meta { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .course-meta .dot { opacity: 0.4; }
  .course-arrow { color: var(--text-faint); flex-shrink: 0; }

  .file-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    transition: border-color 0.2s;
  }
  .file-card:hover { border-color: var(--border-2); }
  .file-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .file-icon { font-size: 22px; flex-shrink: 0; }
  .file-title { font-size: 15px; font-weight: 800; flex: 1; }
  .file-actions { margin-top: 10px; }
  .file-open-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 20px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-weight: 700; text-decoration: none; font-size: 14px;
    box-shadow: 0 4px 14px rgba(0,200,83,0.3);
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .file-open-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,200,83,0.4); }
  .file-hint { font-size: 12px; color: var(--text-dim); margin-top: 10px; }

  .empty-state {
    text-align: center; padding: 60px 24px;
    color: var(--text-dim); font-size: 14px;
  }
  .empty-state .emoji { font-size: 44px; margin-bottom: 14px; display: block; opacity: 0.6; }
  .empty-state .title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .empty-state .desc { font-size: 13px; color: var(--text-dim); max-width: 300px; margin: 0 auto; line-height: 1.6; }

  @media (min-width: 700px) {
    #app { max-width: 680px; margin: 0 auto; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script>

/* =====================================================================
   READING MATERIALS DATA
   ---------------------------------------------------------------------
   ➕ To add a file:
     {
       id: "unique-id",              // any unique string
       subject: "Tattoo",            // MUST match an existing course name
       title: "Lecture 1 — Slides",  // what users see
       icon: "📊",                   // emoji (📊 PPT, 📄 PDF, 📝 Word, 📈 Charts)
       file: "filename.pptx"         // exact filename in GitHub repo
     }
   ===================================================================== */
const READING_DATA = [
  /* ==================== TATTOO (Anatomy) ==================== */
  {
    id: "tattoo-ppt-heart",
    subject: "Tattoo",
    title: "Heart Anatomy — Lecture Slides",
    icon: "📊",
    file: "Heart_Anatomy.pptx"
  },
  {
    id: "tattoo-ppt-vessels",
    subject: "Tattoo",
    title: "Great Vessels — Lecture Slides",
    icon: "📊",
    file: "Great_Vessels.pptx"
  },

  /* ==================== CVS PHYSIOLOGY ==================== */
  {
    id: "physio-ppt-cardiac-cycle",
    subject: "CVS Physiology",
    title: "Cardiac Cycle — Slides",
    icon: "📊",
    file: "Cardiac_Cycle.pptx"
  },

  /* ==================== CVS PATHOLOGY ==================== */
  {
    id: "patho-ppt-mi",
    subject: "CVS Pathology",
    title: "MI Pathology — Slides",
    icon: "📊",
    file: "MI_Pathology.pptx"
  }

  /* Add more entries here */
];

/* =====================================================================
   COURSE STYLE — match this to your main site
   ===================================================================== */
const COURSE_STYLE = {
  "Tattoo":           { icon: "🫀", color: "#e91e63", color2: "#7c4dff", bg: "rgba(233,30,99,0.12)", border: "rgba(233,30,99,0.3)" },
  "CVS Physiology":   { icon: "💓", color: "#ff5252", color2: "#e91e63", bg: "rgba(255,82,82,0.12)",  border: "rgba(255,82,82,0.3)" },
  "CVS Pathology":    { icon: "🔬", color: "#4d9fff", color2: "#7c4dff", bg: "rgba(77,159,255,0.12)", border: "rgba(77,159,255,0.3)" },
  "CVS Pharmacology": { icon: "💊", color: "#9c27b0", color2: "#e91e63", bg: "rgba(156,39,176,0.12)", border: "rgba(156,39,176,0.3)" },
  "CVS Microbiology": { icon: "🦠", color: "#f5b800", color2: "#ff6d00", bg: "rgba(245,184,0,0.12)",  border: "rgba(245,184,0,0.3)" },
  "CVS Biochemistry": { icon: "🧬", color: "#00c853", color2: "#00bfa5", bg: "rgba(0,200,83,0.12)",  border: "rgba(0,200,83,0.3)" }
};

function getCourseStyle(subject) {
  return COURSE_STYLE[subject] || {
    icon: "📚", color: "#00c853", color2: "#00bfa5",
    bg: "rgba(0,200,83,0.12)", border: "rgba(0,200,83,0.3)"
  };
}

/* =====================================================================
   HELPERS
   ===================================================================== */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* =====================================================================
   STATE
   ===================================================================== */
const state = {
  view: "courses",   // "courses" | "detail"
  subject: null,
  search: ""
};

/* =====================================================================
   RENDER
   ===================================================================== */
const app = document.getElementById("app");

function render() {
  if (state.view === "detail") return renderDetail();
  renderCourses();
}

/* ---------- COURSES LIST ---------- */
function renderCourses() {
  const subjectsWithFiles = [...new Set(READING_DATA.map(n => n.subject))];

  const filtered = subjectsWithFiles.filter(s => {
    if (!state.search) return true;
    const q = state.search.toLowerCase();
    if (s.toLowerCase().includes(q)) return true;
    return READING_DATA.some(f =>
      f.subject === s &&
      (f.title.toLowerCase().includes(q) || f.file.toLowerCase().includes(q))
    );
  });

  app.innerHTML = `
    <header class="topbar">
      <div class="logo-wrap">
        <div class="logo-badge">📚</div>
        <div>
          <div class="logo-text">Reading Materials</div>
          <div class="logo-sub">${READING_DATA.length} ${READING_DATA.length === 1 ? "file" : "files"} · ${subjectsWithFiles.length} courses</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <a class="icon-btn" href="index.html" title="Back to Quizzes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </a>
        <div class="avatar">CV</div>
      </div>
    </header>

    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Search courses, files..." value="${escapeHtml(state.search)}" />
    </div>

    ${subjectsWithFiles.length === 0
      ? `<div class="empty-state">
           <span class="emoji">📚</span>
           <div class="title">No reading materials yet</div>
           <div class="desc">Add files to the READING_DATA array in this file to see them here.</div>
         </div>`
      : filtered.length === 0
        ? `<div class="empty-state">
             <span class="emoji">🔍</span>
             <div class="title">No results</div>
             <div class="desc">Nothing matches "${escapeHtml(state.search)}".</div>
           </div>`
        : `
          <div class="section-title">
            Courses
            <span class="count">${filtered.length}</span>
          </div>
          <div class="list">
            ${filtered.map(renderCourseCard).join("")}
          </div>
        `
    }
  `;

  bindCoursesEvents();
}

function renderCourseCard(subject) {
  const style = getCourseStyle(subject);
  const files = READING_DATA.filter(n => n.subject === subject);
  const count = files.length;

  return `
    <button class="course-card"
            data-course="${escapeHtml(subject)}"
            style="--course-color:${style.color};--course-color-2:${style.color2};--course-bg:${style.bg};--course-border:${style.border};">
      <div class="course-thumb" style="background:${style.bg};border-color:${style.border};">
        ${style.icon}
      </div>
      <div class="course-body">
        <div class="course-title">${escapeHtml(subject)}</div>
        <div class="course-meta">
          ${count} ${count === 1 ? "file" : "files"}
        </div>
      </div>
      <svg class="course-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  `;
}

function bindCoursesEvents() {
  const search = document.getElementById("searchInput");
  if (search) {
    search.addEventListener("input", e => {
      state.search = e.target.value;
      renderCourses();
      const s2 = document.getElementById("searchInput");
      if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); }
    });
  }
  document.querySelectorAll("[data-course]").forEach(el => {
    el.addEventListener("click", () => {
      state.subject = el.dataset.course;
      state.view = "detail";
      state.search = "";
      render();
      window.scrollTo(0, 0);
    });
  });
}

/* ---------- DETAIL VIEW ---------- */
function renderDetail() {
  const subject = state.subject;
  const style = getCourseStyle(subject);
  const files = READING_DATA.filter(n => n.subject === subject);

  app.innerHTML = `
    <header class="topbar">
      <div class="logo-wrap">
        <button class="icon-btn" id="backBtn" title="Back" style="margin-right: 4px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <div class="logo-badge" style="background:linear-gradient(135deg,${style.color},${style.color2});">
          ${style.icon}
        </div>
        <div>
          <div class="logo-text">${escapeHtml(subject)}</div>
          <div class="logo-sub">${files.length} ${files.length === 1 ? "file" : "files"}</div>
        </div>
      </div>
      <div class="avatar">CV</div>
    </header>

    <div class="crumbs">
      <span class="crumb link" data-crumb="courses">Courses</span>
      <span class="crumb-sep">›</span>
      <span class="crumb current">${escapeHtml(subject)}</span>
    </div>

    ${files.length === 0
      ? `<div class="empty-state">
           <span class="emoji">📚</span>
           <div class="title">No files for ${escapeHtml(subject)}</div>
           <div class="desc">Add files for this course in the READING_DATA array.</div>
         </div>`
      : `<div class="list">
          ${files.map(renderFileCard).join("")}
        </div>`
    }
  `;

  bindDetailEvents();
}

function renderFileCard(note) {
  const file = (note.file || "").toLowerCase();
  let icon = "📄", label = "Open document";
  if (file.endsWith(".pptx") || file.endsWith(".ppt")) { icon = "📊"; label = "Open presentation"; }
  else if (file.endsWith(".pdf")) { icon = "📄"; label = "Open PDF"; }
  else if (file.endsWith(".docx") || file.endsWith(".doc")) { icon = "📝"; label = "Open document"; }
  else if (file.endsWith(".xlsx") || file.endsWith(".xls")) { icon = "📊"; label = "Open spreadsheet"; }

  return `
    <div class="file-card">
      <div class="file-header">
        <div class="file-icon">${note.icon || icon}</div>
        <div class="file-title">${escapeHtml(note.title)}</div>
      </div>
      <div class="file-actions">
        <a class="file-open-btn" href="${escapeHtml(note.file)}" target="_blank" rel="noopener">
          ${icon} ${label}
        </a>
        <div class="file-hint">Opens in a new tab — you can view, download, or print it.</div>
      </div>
    </div>
  `;
}

function bindDetailEvents() {
  const back = document.getElementById("backBtn");
  if (back) {
    back.addEventListener("click", () => {
      state.view = "courses";
      state.subject = null;
      render();
      window.scrollTo(0, 0);
    });
  }
  document.querySelectorAll("[data-crumb]").forEach(el => {
    el.addEventListener("click", () => {
      state.view = "courses";
      state.subject = null;
      render();
      window.scrollTo(0, 0);
    });
  });
}

/* =====================================================================
   BOOT
   ===================================================================== */
render();
</script>
</body>
</html>
